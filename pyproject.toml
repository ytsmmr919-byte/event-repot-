[project]
name = "event-report"
version = "0.2.0"
description = "イベント動画を文字起こしし、イベントレポート(Markdown)を作成するツール"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.11",
    "elevenlabs>=2.70",
    "httpx>=0.27",
    "imageio-ffmpeg>=0.6",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
